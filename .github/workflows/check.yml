name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
  connector:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/internet.test.ts
  container:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: phoenix-agent:test
          cache-from: type=gha,scope=container-${{ matrix.os }}
          cache-to: type=gha,scope=container-${{ matrix.os }},mode=max
      - run: >-
          docker run --rm --read-only --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER
          --security-opt no-new-privileges:true --shm-size 256m
          --memory 2g --memory-swap 2g --cpus 1
          --tmpfs /tmp:rw,nosuid,nodev,size=64m
          --mount type=bind,src=${{ github.workspace }}/scripts,target=/app/scripts,readonly
          phoenix-agent:test /bin/node scripts/container-smoke.ts

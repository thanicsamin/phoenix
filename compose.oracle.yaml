# Oracle Ampere A1: native ARM build; all persistence and limits come from compose.yaml.
services:
  phoenix:
    platform: linux/arm64
    ports: !reset []
    environment:
      PHOENIX_PUBLIC_IP: ${PHOENIX_PUBLIC_IP:-auto}
  https:
    profiles: !reset []
    environment:
      PHOENIX_PUBLIC_IP: ${PHOENIX_PUBLIC_IP:-auto}

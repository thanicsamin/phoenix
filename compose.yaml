services:
  phoenix:
    build: .
    image: phoenix-agent:local
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - phoenix-data:/data
      - nix-store:/nix/store
      - nix-state:/nix/var/nix
      - ./agent.json:/app/agent.json:ro
    env_file:
      - path: .env
        required: false
    environment:
      PHOENIX_PUBLIC_IP: ${PHOENIX_PUBLIC_IP:-}
      PHOENIX_HTTPS_PORT: ${PHOENIX_HTTPS_PORT:-24843}
    mem_limit: ${PHOENIX_MEMORY_LIMIT:-2g}
    memswap_limit: ${PHOENIX_MEMORY_LIMIT:-2g}
    cpus: ${PHOENIX_CPU_LIMIT:-1}
    shm_size: 256mb
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    stop_grace_period: 15s
  https:
    # Enabled by default on Oracle; enable the public profile on other VPS hosts.
    profiles: [public]
    image: caddy:2.11.6-alpine@sha256:c776e0c6413b544d0459665e54ec7b8b2a15000c0cbee8b254da0067b1d184ff
    restart: unless-stopped
    entrypoint: [/bin/sh, /etc/caddy/start.sh]
    ports:
      - "${PHOENIX_HTTPS_PORT:-24843}:443"
      - "80:80"
    environment:
      PHOENIX_PUBLIC_IP: ${PHOENIX_PUBLIC_IP:-}
      GOMEMLIMIT: 80MiB
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/start-https.sh:/etc/caddy/start.sh:ro
      - https-data:/data
      - https-config:/config
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  phoenix-data:
  nix-store:
  nix-state:
  https-data:
  https-config:
